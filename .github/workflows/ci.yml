name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax check
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*')
          if ((${#files[@]})); then
            bash -n "${files[@]}"
          fi
